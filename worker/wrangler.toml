name = "temp-mail"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Worker сам отдаёт страницу из public/ — это зеркало сайта и удобный локальный запуск через `wrangler dev`
[assets]
directory = "../public"

# Удаление просроченных ящиков — раз в минуту
[triggers]
crons = ["* * * * *"]

[vars]
# С каких сайтов браузеру разрешено обращаться к Worker'у
ALLOWED_ORIGINS = "https://wilberods-coder.github.io,http://127.0.0.1:5190,http://localhost:5190"
# OAuth Client ID из Google Cloud Console (публичный, не секрет). Пусто — кнопка Google скрыта
GOOGLE_CLIENT_ID = "976171605030-97d31rst79j09p71ogpred0b8uajpbp0.apps.googleusercontent.com"

[[d1_databases]]
binding = "DB"
database_name = "temp-mail"
database_id = "35eb4cb3-f910-4f9e-9e7e-1031fe3d5f20"
